# This pb, will create gcp instance 
- name: Create GCP Playbook 
  hosts: localhost
  #become: true 
  #become_user: kk 
  vars_files: 
    - ../vars/gcp_credential.yaml 
  tasks: 
    - name: Slurp Local Public Key
      slurp: 
        src: "{{ssh_pub_path}}"
      register: ssh_pub_key
    - name: Install Pip
      apt: 
        name: python3-pip
        state: present 
      when: false 
    - name: Ensure the package are installed
      pip:
        name:
          - requests
          - google-auth
      when: false  
    - name: Install Python packages via apt
      become: true 
      apt:
        name:
          - python3-requests
          - python3-google-auth
        state: present
        update_cache: yes
      when: true 
    - name: Create GCP instance
      google.cloud.gcp_compute_instance:
        name: "{{machine_name}}"
        machine_type: "e2-medium"
        zone: "us-central1-a"
        project: "{{gcp_project_id}}"
        auth_kind: application
        #auth_kind: "serviceaccount"
        #service_account_file: "{{ service_account_path }}"
        state: present
        metadata:
        
          ssh-keys: "kk:{{ ssh_pub_key['content'] | b64decode }}"
          startup-script: |
            #!/bin/bash 
            sudo apt-get update && sudo apt-get upgrade -y 
            sudo apt-get install fish -y
        # Distro + Disk Size 
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts"
              disk_size_gb: 15
              disk_type: "pd-standard"
        # Network Config Default
        network_interfaces:
          - network:
              selfLink: "projects/{{gcp_project_id}}/global/networks/default"
            access_configs:
              - name: External NAT
                type: ONE_TO_ONE_NAT
        # Network Tags (80,443)
        tags:
          items:
            - http-server
            - https-server
      register: gcp_instance
      when: true 
      # environment: 
      #   GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
      #   GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"

   # Debug mode: for seeing what can we used in file 
    - name: Write gcp_instance into json file
      copy:
        content: "{{ gcp_instance }}"
        dest: "./gcp_instance.json"
      when: true 